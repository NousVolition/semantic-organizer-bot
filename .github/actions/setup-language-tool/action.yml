name: Install requested language tool
description: Install pinned tools on a disposable GitHub runner, outside the Render web process.
inputs:
  tool:
    description: hermit or lambeq
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tools/requirements-*.txt
    - if: inputs.tool == 'hermit'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - if: inputs.tool == 'hermit'
      shell: bash
      run: python -m pip install -r tools/requirements-hermit.txt
    - if: inputs.tool == 'lambeq'
      shell: bash
      run: |
        python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r tools/requirements-lambeq.txt

